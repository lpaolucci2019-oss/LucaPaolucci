<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Luca Night Shift Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --green:#1A9E72;--green-light:#E1F5EE;--green-dark:#0A3D2E;
  --amber:#D97706;--amber-light:#FEF3C7;
  --red:#DC2626;--red-light:#FEE2E2;
  --blue:#2563EB;--blue-light:#EFF6FF;
  --bg:#F5F5F3;--card:#FFFFFF;--border:#E5E5E1;
  --text:#1A1A18;--text2:#52524E;--text3:#A8A8A0;
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── AUTH OVERLAY ── */
#auth-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#auth-overlay.hidden{display:none}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:360px}
.auth-logo{width:48px;height:48px;border-radius:50%;background:var(--green-dark);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin:0 auto 16px}
.auth-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--text);text-align:center;margin-bottom:4px}
.auth-sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:20px}
.auth-field{margin-bottom:12px}
.auth-field label{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:5px}
.auth-field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:'Inter',sans-serif;color:var(--text);background:var(--card);outline:none;transition:border-color .15s}
.auth-field input:focus{border-color:var(--green)}
.auth-btn{width:100%;padding:13px;background:var(--green-dark);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-err{font-size:11px;color:var(--red);background:var(--red-light);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:10px;display:none}

/* ── TOPBAR ── */
.topbar{background:var(--green-dark);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{}
.topbar-title{font-family:'Playfair Display',serif;font-size:19px;color:#fff}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:10px}
.admin-badge{font-size:10px;font-weight:600;color:var(--green);background:var(--green-light);padding:3px 10px;border-radius:20px}
.signout-btn{padding:7px 14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;background:transparent;color:rgba(255,255,255,.8);font-size:11px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.signout-btn:hover{background:rgba(255,255,255,.1)}
.refresh-btn{padding:7px 14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}

/* ── LAYOUT ── */
.main{max-width:1140px;margin:0 auto;padding:24px 20px}

/* ── STATS BAR ── */
.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;text-align:center}
.stat-val{font-family:'Playfair Display',serif;font-size:26px;color:var(--text);line-height:1}
.stat-label{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}

/* ── SEARCH & FILTER BAR ── */
.filter-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text3)}
#search-input{width:100%;padding:8px 10px 8px 30px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
#search-input:focus{border-color:var(--green);background:var(--card)}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.filter-pill{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;background:var(--bg);transition:all .15s;white-space:nowrap}
.filter-pill.active{border-color:var(--green);background:var(--green-light);color:var(--green)}
.sort-select{padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:'Inter',sans-serif;color:var(--text2);background:var(--bg);cursor:pointer;outline:none}
.result-count{font-size:11px;color:var(--text3);white-space:nowrap}

/* ── USER CARDS ── */
.users-grid{display:flex;flex-direction:column;gap:10px}
.user-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.user-header{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;background:var(--bg);border-bottom:1px solid transparent;transition:background .15s}
.user-header:hover{background:#EDEDEB}
.user-card.expanded .user-header{border-bottom-color:var(--border)}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:600;color:var(--text)}
.user-email{font-size:11px;color:var(--text3);margin-top:1px}
.user-meta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-amber{background:var(--amber-light);color:var(--amber)}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-gray{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.chevron{font-size:13px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.user-card.expanded .chevron{transform:rotate(180deg)}

/* ── USER BODY ── */
.user-body{display:none;padding:16px;gap:12px;grid-template-columns:1fr 1fr}
.user-card.expanded .user-body{display:grid}
.data-section{background:var(--bg);border-radius:var(--radius-sm);padding:13px}
.data-section-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.data-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.data-row:last-child{border-bottom:none}
.data-row-label{color:var(--text2);flex-shrink:0}
.data-row-val{font-weight:600;color:var(--text);text-align:right}

/* Weight chips */
.weight-history{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.weight-chip{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:11px;font-weight:600;color:var(--text);text-align:center}
.weight-chip-date{font-size:9px;color:var(--text3);font-weight:400;margin-top:1px}
.weight-trend{margin-top:8px;font-size:11px;font-weight:600}
.trend-down{color:var(--green)}
.trend-up{color:var(--red)}

/* Check-in rows */
.ci-list{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.ci-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:6px;padding:7px 10px;font-size:11px}
.ci-date{color:var(--text2)}
.ci-score{font-weight:700}
.ci-green{color:var(--green)}
.ci-amber{color:var(--amber)}
.ci-red{color:var(--red)}
.ci-answers{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}
.ci-ans-chip{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600}

/* Notes */
.notes-list{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.note-item{background:var(--card);border-radius:6px;padding:9px 11px;border-left:3px solid var(--green)}
.note-date{font-size:10px;color:var(--text3);margin-bottom:3px}
.note-text{font-size:12px;color:var(--text2);line-height:1.5;white-space:pre-wrap;word-break:break-word}

/* Schedule */
.shift-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.shift-cell{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:600;line-height:1.2}
.shift-night{background:var(--green);color:#fff}
.shift-off{background:var(--card);border:1px solid var(--border);color:var(--text3)}

/* Full-width sections */
.full-width{grid-column:1/-1}

/* Empty state */
.empty-state{font-size:12px;color:var(--text3);font-style:italic;padding:4px 0}

/* ── LOADING / EMPTY ── */
.loading-state{text-align:center;padding:48px 20px;color:var(--text3);font-size:13px}
.loading-state svg{margin-bottom:10px;opacity:.3;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .stats-bar{grid-template-columns:1fr 1fr}
  .user-card.expanded .user-body{grid-template-columns:1fr}
  .filter-bar{flex-direction:column;align-items:stretch}
  .search-wrap{min-width:unset}
}
@media(max-width:400px){
  .stats-bar{grid-template-columns:1fr}
  .user-meta .badge{display:none}
}
</style>
</head>
<body>

<!-- ── AUTH OVERLAY ── -->
<div id="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">L</div>
    <div class="auth-title">Admin Access</div>
    <div class="auth-sub">Night Shift Coaching — Authorized Personnel Only</div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="admin@email.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="auth-btn" id="auth-btn" onclick="adminSignIn()">Sign in</button>
  </div>
</div>

<!-- ── TOPBAR ── -->
<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-left">
    <div class="topbar-title">Admin Dashboard</div>
    <div class="topbar-sub" id="topbar-sub">Luca Night Shift Coaching</div>
  </div>
  <div class="topbar-right">
    <span class="admin-badge" id="admin-name-badge">Admin</span>
    <button class="refresh-btn" onclick="reloadClients()">↻ Refresh</button>
    <button class="signout-btn" onclick="firebase.auth().signOut()">Sign out</button>
  </div>
</div>

<!-- ── MAIN ── -->
<div class="main" id="main-content" style="display:none">

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-val" id="stat-total">—</div><div class="stat-label">Total clients</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-complete">—</div><div class="stat-label">Profile complete</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-active">—</div><div class="stat-label">Active this week</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-checkins">—</div><div class="stat-label">Total check-ins</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-weigh">—</div><div class="stat-label">Total weigh-ins</div></div>
  </div>

  <!-- Search + filter bar -->
  <div class="filter-bar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search by name or email…" oninput="applyFilters()" autocomplete="off" maxlength="100">
    </div>
    <div class="filter-pills">
      <div class="filter-pill active" data-filter="all"       onclick="setFilter('all',this)">All</div>
      <div class="filter-pill"        data-filter="complete"  onclick="setFilter('complete',this)">Profile complete</div>
      <div class="filter-pill"        data-filter="active"    onclick="setFilter('active',this)">Active this week</div>
      <div class="filter-pill"        data-filter="no-checkin" onclick="setFilter('no-checkin',this)">No check-ins</div>
    </div>
    <select class="sort-select" id="sort-select" onchange="applyFilters()">
      <option value="name">Sort: Name</option>
      <option value="checkins">Sort: Most check-ins</option>
      <option value="weight">Sort: Most weigh-ins</option>
      <option value="recent">Sort: Recent activity</option>
    </select>
    <span class="result-count" id="result-count"></span>
  </div>

  <!-- User list -->
  <div id="users-container">
    <div class="loading-state" id="loading-state" style="display:none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-dasharray="28" stroke-dashoffset="10"/></svg>
      <div>Loading client data…</div>
    </div>
    <div class="users-grid" id="users-grid"></div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────
// PASTE YOUR FIREBASE CONFIG HERE (same values as luca-app.html)
// ─────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBXdJi-B71sVv5RIsc1jV5tNp8uPq-IJCk",
  authDomain: "luca-app-995f4.firebaseapp.com",
  projectId: "luca-app-995f4",
  storageBucket: "luca-app-995f4.firebasestorage.app",
  messagingSenderId: "8175326678",
  appId: "1:8175326678:web:82451ecc01f9e3800cc077",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── XSS PROTECTION ───────────────────────────────────────
// All user-supplied strings pass through this before being
// inserted into innerHTML. Never bypass it.
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#x27;');
}

// ── INPUT VALIDATION ─────────────────────────────────────
function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

// ── RATE LIMITING (client-side guard) ────────────────────
let lastAuthAttempt = 0;
const AUTH_THROTTLE_MS = 2000; // 2 s between attempts

// ── AUTH ─────────────────────────────────────────────────
async function adminSignIn() {
  const now = Date.now();
  if (now - lastAuthAttempt < AUTH_THROTTLE_MS) return;
  lastAuthAttempt = now;

  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl    = document.getElementById('auth-err');
  const btn      = document.getElementById('auth-btn');
  errEl.style.display = 'none';

  // Client-side input validation (Firebase validates server-side too)
  if (!email || !isValidEmail(email)) {
    errEl.textContent = 'Please enter a valid email address.';
    errEl.style.display = 'block';
    return;
  }
  if (!password || password.length < 6) {
    errEl.textContent = 'Password must be at least 6 characters.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Signing in…';
  try {
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged handles the rest
  } catch(e) {
    // Never reveal whether the email exists or not
    errEl.textContent   = 'Incorrect email or password.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Sign in';
  }
}

['auth-email','auth-password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') adminSignIn();
  });
});

// ── AUTH STATE ────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  if (!user) {
    showAuthOverlay();
    return;
  }

  // Authorization check: verify the signed-in user is in the
  // 'admins' Firestore collection. This is also enforced by
  // Firestore security rules server-side — the client check is
  // a UX guard only.
  let isAdmin = false;
  try {
    const adminDoc = await db.collection('admins').doc(user.uid).get();
    isAdmin = adminDoc.exists;
  } catch(e) {
    // If the read fails (e.g. rules denied), treat as not admin
    isAdmin = false;
  }

  if (!isAdmin) {
    // Sign out immediately — don't leave an authenticated non-admin session
    await auth.signOut();
    const errEl = document.getElementById('auth-err');
    errEl.textContent   = 'Access denied. This account does not have admin privileges.';
    errEl.style.display = 'block';
    showAuthOverlay();
    return;
  }

  showDashboard(user);
  loadAllClients();
});

function showAuthOverlay() {
  document.getElementById('auth-overlay').classList.remove('hidden');
  document.getElementById('topbar').style.display        = 'none';
  document.getElementById('main-content').style.display  = 'none';
}

function showDashboard(user) {
  document.getElementById('auth-overlay').classList.add('hidden');
  document.getElementById('topbar').style.display        = 'flex';
  document.getElementById('main-content').style.display  = 'block';
  // Show admin's own email in the topbar so it's clear who is signed in
  const badge = document.getElementById('admin-name-badge');
  badge.textContent = esc(user.email || 'Admin');
}

// ── DATA STORE ───────────────────────────────────────────
// Loaded once, filtered/sorted in memory for fast UX
let allUsers = [];
let activeFilter = 'all';

// ── LOAD ALL CLIENTS ─────────────────────────────────────
async function loadAllClients() {
  document.getElementById('loading-state').style.display = 'block';
  document.getElementById('users-grid').innerHTML = '';
  document.getElementById('result-count').textContent = '';

  try {
    const usersSnap = await db.collection('users').get();

    // Load every user's subcollections in parallel (one Promise.all per user,
    // all users kicked off concurrently)
    const userPromises = usersSnap.docs.map(async uDoc => {
      const uid = uDoc.id;
      const col = (name) => db.collection('users').doc(uid).collection(name);

      const [weightsSnap, checkinsSnap, notesSnap] = await Promise.all([
        col('weights').orderBy('ts', 'asc').get(),
        col('checkins').orderBy('ts', 'desc').get(),  // newest first for display
        col('notes').orderBy('ts', 'desc').get(),
      ]);

      return {
        uid,
        profile:  uDoc.data(),
        weights:  weightsSnap.docs.map(d => d.data()),
        checkins: checkinsSnap.docs.map(d => d.data()),
        notes:    notesSnap.docs.map(d => d.data()),
      };
    });

    allUsers = await Promise.all(userPromises);
    updateStats();
    applyFilters();
  } catch(e) {
    document.getElementById('users-grid').innerHTML =
      `<div class="loading-state">Failed to load data. You may not have admin access, or check your Firebase config.</div>`;
  } finally {
    document.getElementById('loading-state').style.display = 'none';
  }
}

function reloadClients() { loadAllClients(); }

// ── STATS ─────────────────────────────────────────────────
function updateStats() {
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const active = allUsers.filter(u =>
    u.checkins.some(c => c.ts?.toMillis?.() > sevenDaysAgo) ||
    u.weights.some(w => w.ts?.toMillis?.() > sevenDaysAgo)
  );
  document.getElementById('stat-total').textContent    = allUsers.length;
  document.getElementById('stat-complete').textContent = allUsers.filter(u => u.profile.profileComplete).length;
  document.getElementById('stat-active').textContent   = active.length;
  document.getElementById('stat-checkins').textContent = allUsers.reduce((a,u) => a + u.checkins.length, 0);
  document.getElementById('stat-weigh').textContent    = allUsers.reduce((a,u) => a + u.weights.length, 0);
}

// ── FILTER & SORT ─────────────────────────────────────────
function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  // Sanitize search input — only use it for comparison, never insert raw into DOM
  const raw    = document.getElementById('search-input').value;
  const query  = raw.trim().toLowerCase().slice(0, 100); // cap at 100 chars
  const sort   = document.getElementById('sort-select').value;
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;

  let filtered = allUsers.filter(u => {
    const p = u.profile;
    // Search match
    if (query) {
      const name  = (p.name  || '').toLowerCase();
      const email = (p.email || '').toLowerCase();
      if (!name.includes(query) && !email.includes(query)) return false;
    }
    // Active filter
    if (activeFilter === 'complete'   && !p.profileComplete) return false;
    if (activeFilter === 'active'     && !u.checkins.some(c => c.ts?.toMillis?.() > sevenDaysAgo)
                                      && !u.weights.some(w  => w.ts?.toMillis?.() > sevenDaysAgo)) return false;
    if (activeFilter === 'no-checkin' && u.checkins.length > 0) return false;
    return true;
  });

  // Sort
  filtered.sort((a, b) => {
    if (sort === 'name')     return (a.profile.name||'').localeCompare(b.profile.name||'');
    if (sort === 'checkins') return b.checkins.length - a.checkins.length;
    if (sort === 'weight')   return b.weights.length  - a.weights.length;
    if (sort === 'recent') {
      const aTime = Math.max(
        a.checkins[0]?.ts?.toMillis?.() || 0,
        a.weights[a.weights.length-1]?.ts?.toMillis?.() || 0
      );
      const bTime = Math.max(
        b.checkins[0]?.ts?.toMillis?.() || 0,
        b.weights[b.weights.length-1]?.ts?.toMillis?.() || 0
      );
      return bTime - aTime;
    }
    return 0;
  });

  document.getElementById('result-count').textContent =
    `${filtered.length} of ${allUsers.length} client${allUsers.length !== 1 ? 's' : ''}`;

  renderUsers(filtered);
}

// ── RENDER ────────────────────────────────────────────────
function renderUsers(users) {
  const grid = document.getElementById('users-grid');

  if (!users.length) {
    grid.innerHTML = `<div class="loading-state" style="display:block">
      <div style="font-size:13px;color:var(--text3)">${allUsers.length ? 'No clients match your search.' : 'No clients yet.'}</div>
    </div>`;
    return;
  }

  grid.innerHTML = users.map((u, idx) => buildUserCard(u, idx)).join('');
}

function buildUserCard(u, idx) {
  const p    = u.profile;
  const name = p.name || 'Unnamed';

  // ── Header badges ──
  const profileBadge = p.profileComplete
    ? '<span class="badge badge-green">Profile complete</span>'
    : '<span class="badge badge-gray">No profile</span>';

  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const isActive = u.checkins.some(c => c.ts?.toMillis?.() > sevenDaysAgo) ||
                   u.weights.some(w  => w.ts?.toMillis?.() > sevenDaysAgo);
  const activeBadge = isActive ? '<span class="badge badge-blue">Active</span>' : '';

  const lastCI   = u.checkins[0]; // newest first
  const ciScoreBadge = lastCI
    ? `<span class="badge ${lastCI.score>=70?'badge-green':lastCI.score>=40?'badge-amber':'badge-red'}">${lastCI.score}%</span>`
    : '';

  // ── Profile data ──
  const profileRows = [
    ['Name',        esc(p.name)                    || '—'],
    ['Email',       esc(p.email)                   || '—'],
    ['Age',         p.age                          ? esc(p.age) + ' yrs' : '—'],
    ['Sex',         esc(p.sex)                     || '—'],
    ['Height',      p.height                       ? esc(p.height) + ' in' : '—'],
    ['Start weight',p.weight                       ? esc(p.weight) + ' lbs' : '—'],
    ['Activity',    esc(actLabel(p.activity))],
    ['Pace',        esc(paceLabel(p.pace))],
    ['Macros',      esc(macroPrefLabel(p.macroPref))],
  ].map(([l,v]) => `
    <div class="data-row">
      <span class="data-row-label">${l}</span>
      <span class="data-row-val">${v}</span>
    </div>`).join('');

  // ── Weight history ──
  const weightHtml = buildWeightSection(u.weights);

  // ── Check-ins ──
  const ciHtml = buildCheckinSection(u.checkins);

  // ── Notes ──
  const notesHtml = buildNotesSection(u.notes);

  // ── Schedule ──
  const schedHtml = buildScheduleSection(p.schedule || {});

  return `
  <div class="user-card" id="ucard-${idx}">
    <div class="user-header" onclick="toggleCard(${idx})">
      <div class="user-avatar">${esc(name[0].toUpperCase())}</div>
      <div>
        <div class="user-name">${esc(name)}</div>
        <div class="user-email">${esc(p.email || 'No email')}</div>
      </div>
      <div class="user-meta">
        ${profileBadge}
        ${activeBadge}
        ${ciScoreBadge}
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="user-body">
      <div class="data-section">
        <div class="data-section-title">Profile</div>
        ${profileRows}
      </div>
      <div class="data-section">
        <div class="data-section-title">
          Weight tracking
          <span style="font-weight:400;text-transform:none;font-size:10px">${u.weights.length} entries</span>
        </div>
        ${weightHtml}
      </div>
      <div class="data-section">
        <div class="data-section-title">
          Check-ins
          <span style="font-weight:400;text-transform:none;font-size:10px">${u.checkins.length} total</span>
        </div>
        ${ciHtml}
      </div>
      <div class="data-section">
        <div class="data-section-title">
          Notes
          <span style="font-weight:400;text-transform:none;font-size:10px">${u.notes.length} total</span>
        </div>
        ${notesHtml}
      </div>
      <div class="data-section full-width">
        <div class="data-section-title">Night shift schedule</div>
        ${schedHtml}
      </div>
    </div>
  </div>`;
}

// ── WEIGHT SECTION ────────────────────────────────────────
function buildWeightSection(weights) {
  if (!weights.length) return '<div class="empty-state">No weigh-ins yet</div>';

  const chips = weights.map(w => `
    <div class="weight-chip">
      ${esc(w.lbs)} lbs
      <div class="weight-chip-date">${esc(w.date || '')}</div>
    </div>`).join('');

  let trend = '';
  if (weights.length >= 2) {
    const diff = (weights[0].lbs - weights[weights.length-1].lbs);
    if (diff > 0) {
      trend = `<div class="weight-trend trend-down">↓ ${diff.toFixed(1)} lbs lost over ${weights.length} weigh-ins</div>`;
    } else if (diff < 0) {
      trend = `<div class="weight-trend trend-up">↑ ${Math.abs(diff).toFixed(1)} lbs gained over ${weights.length} weigh-ins</div>`;
    } else {
      trend = `<div class="weight-trend" style="color:var(--text3)">No net change over ${weights.length} weigh-ins</div>`;
    }
  }

  return `<div class="weight-history">${chips}</div>${trend}`;
}

// ── CHECK-IN SECTION ──────────────────────────────────────
const Q_LABELS = ['Sleep','Energy','Calories','Protein','Mental','Workout','Cravings'];
const Q_OPTS   = [
  ['Great','Okay','Terrible'],
  ['High','Moderate','Low'],
  ['Yes','Close','No'],
  ['Yes','Close','No'],
  ['Good','Okay','Struggling'],
  ['Yes','Partially','No'],
  ['Managed','Moderate','Bad'],
];

function buildCheckinSection(checkins) {
  if (!checkins.length) return '<div class="empty-state">No check-ins yet</div>';

  const rows = checkins.slice(0, 7).map(c => {
    const cls   = c.score >= 70 ? 'ci-green' : c.score >= 40 ? 'ci-amber' : 'ci-red';
    const label = c.score >= 70 ? 'Green' : c.score >= 40 ? 'Yellow' : 'Red';
    const ts    = fmtDate(c.ts);
    const date  = c.date || ts;

    // Render per-question answers if available
    let answerHtml = '';
    if (c.answers && typeof c.answers === 'object') {
      const chips = Object.entries(c.answers).map(([qi, oi]) => {
        const qIdx  = parseInt(qi, 10);
        const oIdx  = parseInt(oi, 10);
        const qName = Q_LABELS[qIdx] || `Q${qIdx+1}`;
        const oName = (Q_OPTS[qIdx] || [])[oIdx] || `${oIdx}`;
        const bg    = oIdx === 0 ? 'var(--green-light)' : oIdx === 1 ? 'var(--amber-light)' : 'var(--red-light)';
        const col   = oIdx === 0 ? 'var(--green)'       : oIdx === 1 ? 'var(--amber)'       : 'var(--red)';
        return `<span class="ci-ans-chip" style="background:${bg};color:${col}">${esc(qName)}: ${esc(oName)}</span>`;
      }).join('');
      if (chips) answerHtml = `<div class="ci-answers">${chips}</div>`;
    }

    return `<div class="ci-row" style="flex-direction:column;align-items:stretch;gap:4px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="ci-date">${esc(date)}</span>
        <span class="ci-score ${cls}">${label} · ${c.score}%</span>
      </div>
      ${answerHtml}
    </div>`;
  }).join('');

  const more = checkins.length > 7
    ? `<div style="font-size:11px;color:var(--text3);text-align:center;padding:4px 0">+ ${checkins.length - 7} more check-ins</div>`
    : '';

  return `<div class="ci-list">${rows}</div>${more}`;
}

// ── NOTES SECTION ─────────────────────────────────────────
function buildNotesSection(notes) {
  if (!notes.length) return '<div class="empty-state">No notes yet</div>';

  const items = notes.slice(0, 4).map(n => `
    <div class="note-item">
      <div class="note-date">${esc(fmtDate(n.ts))}</div>
      <div class="note-text">${esc(n.text)}</div>
    </div>`).join('');

  const more = notes.length > 4
    ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">+ ${notes.length - 4} more notes</div>`
    : '';

  return `<div class="notes-list">${items}</div>${more}`;
}

// ── SCHEDULE SECTION ──────────────────────────────────────
function buildScheduleSection(schedule) {
  const shiftDays = Object.entries(schedule)
    .filter(([, v]) => v === true)
    .map(([k]) => k)
    .sort();

  if (!shiftDays.length) return '<div class="empty-state">No night shifts logged</div>';

  // Group by year-month for a compact calendar view
  const byMonth = {};
  shiftDays.forEach(k => {
    const [y, m] = k.split('-');
    const label  = monthLabel(parseInt(m, 10) - 1) + ' ' + y;
    if (!byMonth[label]) byMonth[label] = [];
    byMonth[label].push(parseInt(k.split('-')[2], 10));
  });

  const monthBlocks = Object.entries(byMonth).map(([mo, days]) => {
    const chips = days.map(d =>
      `<span class="badge badge-green" style="padding:2px 7px;font-size:10px">${d}</span>`
    ).join('');
    return `<div style="margin-bottom:8px">
      <div style="font-size:10px;font-weight:600;color:var(--text2);margin-bottom:4px">${esc(mo)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${chips}</div>
    </div>`;
  }).join('');

  return `${monthBlocks}<div style="font-size:11px;color:var(--text3);margin-top:4px">${shiftDays.length} night shift${shiftDays.length!==1?'s':''} total</div>`;
}

// ── TOGGLE CARD ───────────────────────────────────────────
function toggleCard(idx) {
  document.getElementById(`ucard-${idx}`).classList.toggle('expanded');
}

// ── FORMATTERS ────────────────────────────────────────────
function fmtDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(idx) { return MONTHS[idx] || ''; }

function actLabel(v) {
  const m = { 1.2:'Sedentary', 1.375:'Lightly active', 1.55:'Moderately active', 1.725:'Very active' };
  return m[v] || (v ? String(v) : '—');
}

function paceLabel(v) {
  if (v === undefined || v === null) return '—';
  const m = { '-200':'Slow (−200 cal)', '-350':'Moderate (−350 cal)', '-500':'Aggressive (−500 cal)' };
  return m[String(v)] || String(v);
}

function macroPrefLabel(v) {
  const m = { balanced:'Balanced', highcarb:'Higher carbs', highfat:'Higher fat' };
  return m[v] || (v ? String(v) : '—');
}
</script>
